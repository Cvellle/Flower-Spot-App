name: My CI Workflow

on:
  push:
    branches:
      - main # Trigger on pushes to the main branch

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Debug project structure
        run: ls -R

      - name: Run tests
        run: npx jest --verbose --runInBand

      - name: Install dependencies
        run: npm ci # use npm ci for clean CI installs

      - name: Run tests
        run: npm test
