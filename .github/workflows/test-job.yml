name: Test CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  test-job:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Debug files
        run: ls -R src/tests || echo "No tests folder"

      - name: Run tests
        run: npx jest --verbose --runInBand
